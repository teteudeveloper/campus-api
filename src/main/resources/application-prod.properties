# Perfil de produção: todas as variáveis obrigatórias (DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET) devem ser
# definidas no ambiente; a aplicação não inicia sem elas.
app.security.jwt.permitir-segredo-efemero=false

# Atrás de proxy reverso confiável, defina FORWARD_HEADERS_STRATEGY=native para que o IP real do cliente
# seja usado no limite de tentativas de login. Sem proxy, mantenha "none" (cabeçalhos X-Forwarded-* ignorados).
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
