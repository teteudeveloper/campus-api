# ---------------------------------------------------------------------------
# Configuração comum. Valores sensíveis vêm SEMPRE de variáveis de ambiente.
# Perfis: dev (local; ativado automaticamente por ./mvnw spring-boot:run), test, prod.
# Não há perfil padrão: sem SPRING_PROFILES_ACTIVE, DB_* e JWT_SECRET são obrigatórios e o Swagger fica desligado.
# ---------------------------------------------------------------------------
spring.application.name=campus-api
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Banco de dados (obrigatórios fora do perfil dev). DB_USERNAME deve ser o usuário de runtime (somente DML).
# As migrações podem usar outra credencial (dono do schema) via SPRING_FLYWAY_USER / SPRING_FLYWAY_PASSWORD;
# sem elas, o Flyway usa a mesma conexão da aplicação.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA: o schema é responsabilidade exclusiva do Flyway; o Hibernate apenas valida o mapeamento.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway. FLYWAY_BASELINE_ON_MIGRATE=true somente na adoção única de um banco criado pela versão anterior
# (ver README > Migrações). O baseline é feito na versão 0, portanto nenhuma migração é pulada.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=0
spring.flyway.baseline-description=Adocao do Flyway em banco legado

# Contrato JSON estrito: campos desconhecidos são rejeitados com 400.
spring.jackson.deserialization.fail-on-unknown-properties=true

# Paginação
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Actuator: apenas health (sem detalhes) é exposto.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# OpenAPI/Swagger: desabilitado por padrão
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.default-produces-media-type=application/json
# Respostas de erro são descritas pelo OpenApiConfig; não inferir respostas genéricas do @RestControllerAdvice.
springdoc.override-with-generic-response=false
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Segurança
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.permitir-segredo-efemero=false
app.security.jwt.issuer=${JWT_ISSUER:campus-api}
app.security.jwt.audience=${JWT_AUDIENCE:campus-api-clients}
app.security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT15M}
app.security.jwt.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:P7D}
app.security.jwt.clock-skew=${JWT_CLOCK_SKEW:PT30S}
app.security.login.max-tentativas-por-credencial=${LOGIN_MAX_TENTATIVAS_CREDENCIAL:5}
app.security.login.max-tentativas-por-ip=${LOGIN_MAX_TENTATIVAS_IP:20}
app.security.login.janela=${LOGIN_JANELA:PT15M}
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Primeiro administrador (opcional; ver README)
app.bootstrap.admin.login=${BOOTSTRAP_ADMIN_LOGIN:}
app.bootstrap.admin.senha=${BOOTSTRAP_ADMIN_PASSWORD:}

# Logs com identificador de correlação
logging.pattern.correlation=[%X{correlationId:-}]\u0020
