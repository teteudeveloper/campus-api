# Perfil de desenvolvimento local (ativado por ./mvnw spring-boot:run).
# Lê o .env da raiz do projeto (gerado por scripts/configurar-ambiente-local.sh); variáveis de ambiente prevalecem.
spring.config.import=optional:file:./.env[.properties]

# A aplicação usa o usuário de runtime (somente DML); as migrações usam o dono do schema.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:campus_api}}
spring.datasource.username=${DB_USERNAME:${APP_DB_USER:campus_app}}
spring.datasource.password=${DB_PASSWORD:${APP_DB_PASSWORD:}}
spring.flyway.user=${SPRING_FLYWAY_USER:${POSTGRES_USER:campus_user}}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD:${POSTGRES_PASSWORD:}}

springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

# Sem JWT_SECRET, usa chave aleatória a cada reinício (somente dev).
app.security.jwt.permitir-segredo-efemero=true
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

logging.level.br.com.campusapi=DEBUG
